[workspace]
members = [
    "crates/aster-core",
    "crates/aster-mind",
    "crates/aster-storage",
    "crates/aster-runtime",
    "crates/aster-api",
    "crates/aster-console",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
anyhow = "1.0"
aster-console = { path = "crates/aster-console" }
aster-core = { path = "crates/aster-core" }
aster-mind = { path = "crates/aster-mind" }
aster-runtime = { path = "crates/aster-runtime" }
arc-swap = "1.7"
aster-storage = { path = "crates/aster-storage" }
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
dotenvy = "0.15"
futures-util = "0.3"
http-body-util = "0.1"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
scraper = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.1"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "migrate",
    "macros",
    "json",
    "uuid",
    "chrono",
] }
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.0", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "net",
    "time",
    "sync",
    "io-util",
] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "1"
toml_edit = "0.25"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1.0", features = ["v4", "serde"] }

[profile.release]
strip = true
lto = "thin"
