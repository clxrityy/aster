# Aster live configuration. Copy to aster.toml; every key is optional.
# Edits are picked up within ~1s while `aster serve` runs. An invalid edit is
# rejected and the previous configuration stays active. Secrets stay in .env.
# Values shown are the defaults.

[server]
body_limit_bytes = 131072        # max request body for runtime routes
request_timeout_ms = 15000       # per-request timeout (not the event stream)
rate_limit_per_minute = 240      # owner API requests/min on runtime routes; 0 = off
shutdown_drain_ms = 5000         # HTTP drain time on Ctrl-C
ingest_dir = "data/ingest"       # /ingest may only read files inside here
ingest_max_bytes = 4194304

[database]                       # restart required
pool_size = 5
acquire_timeout_ms = 5000
statement_timeout_ms = 5000

[runtime]
tick_interval_ms = 5000          # regulation/initiative step
paused = false                   # freeze levels and initiative (/pause, /resume)
idle_before_initiative_secs = 120
max_pending_outbound = 5         # unanswered questions/requests at once
max_outbound_per_hour = 6
outbound_expiry_hours = 72
persist_level_epsilon = 0.5      # min level change before decay is saved
rest_minutes = 10                # length of an approved rest
keep_snapshots = 50              # mind snapshots kept for rollback

[cognition]
engine = "statistical"           # or "neural" (needs a --features neural build); no external models
ngram_order = 3
max_reply_tokens = 40
recall_top_k = 5
learning_rate = 0.25
exploration_min = 0.02           # bounds Aster self-regulates exploration within
exploration_max = 0.4
answer_confidence_min = 0.15     # bounds for its confidence threshold to reply
answer_confidence_max = 0.6
snapshot_every_updates = 20
# rng_seed = 42                  # set for reproducible training sessions
initiative_curiosity_min = 55.0  # curiosity needed before it asks on its own
rest_energy_below = 25.0         # energy at which it requests rest
starter_pack = true              # load built-in everyday words, replies, synonyms

# The neural engine: everything "statistical" does, plus a byte-level network
# trained in the background (on each tick) only on what you taught. It adds one
# candidate per turn, scored against the rest. context/embed_dim/hidden shape
# the network: changing them starts a new one.
[cognition.neural]
context = 32                     # bytes of history per prediction
embed_dim = 24
hidden = 256
learning_rate = 0.003
batch = 32
train_steps_per_tick = 8         # 0 pauses training
max_train_ms_per_tick = 200      # hard cap per tick
min_corpus_bytes = 512           # wait until there is this much to learn from
weight = 0.6                     # scales its candidate's score (0 = silent)
temperature = 0.6
top_k = 5
max_reply_bytes = 160
min_steps_to_speak = 2000        # stay quiet until trained this long...
max_loss_to_speak = 1.3          # ...and recent loss (nats/byte) is this low
min_known_words = 0.8            # drop replies with too many unknown words (0 = off)
samples = 3                      # continuations tried per turn; the surest wins

# Owner bounds for each level. Aster moves levels only inside min..=max.
[regulation.levels]
energy         = { baseline = 75.0, decay_per_min = 0.02, min = 0.0, max = 100.0 }
focus          = { baseline = 70.0, decay_per_min = 0.05, min = 0.0, max = 100.0 }
cognitive_load = { baseline = 10.0, decay_per_min = 0.1, min = 0.0, max = 100.0 }
curiosity      = { baseline = 60.0, decay_per_min = 0.03, min = 0.0, max = 100.0 }
stimulation    = { baseline = 40.0, decay_per_min = 0.05, min = 0.0, max = 100.0 }
stress         = { baseline = 10.0, decay_per_min = 0.08, min = 0.0, max = 100.0 }
confidence     = { baseline = 50.0, decay_per_min = 0.01, min = 0.0, max = 100.0 }

# Level deltas per event.
[regulation.events]
message_received  = { cognitive_load = 4.0, stimulation = 5.0, energy = -0.5 }
reply_sent        = { energy = -0.5, focus = 1.0 }
positive_feedback = { confidence = 3.0, stress = -2.0 }
negative_feedback = { confidence = -3.0, stress = 3.0, curiosity = 1.0 }
unknown_concept   = { curiosity = 4.0, cognitive_load = 2.0 }
taught            = { confidence = 1.5, cognitive_load = 2.0 }
question_answered = { curiosity = -3.0, confidence = 2.0 }
ingested          = { cognitive_load = 8.0, energy = -3.0, curiosity = 2.0 }
rest              = { energy = 10.0, cognitive_load = -10.0, stress = -5.0 }

[logs]
dir = "data/logs"                # <dir>/<category>/YYYY-MM-DD.jsonl
enabled = ["conversations", "thoughts", "levels", "memories", "requests", "config", "runtime"]  # also "training"
retention_days = 30              # 0 = keep forever

[console]
server_url = "http://127.0.0.1:3000"
refresh_ms = 100
show_trace = true
training_prompt_after_reply = true
history_turns = 50

# The web dashboard, on the same port as the API. Sign in with the owner token;
# the browser then holds an HttpOnly session cookie (never the token itself).
[dashboard]
enabled = true
cookie_secure = true             # HTTPS-only cookie; fine on http://localhost too
session_idle_minutes = 60
session_max_hours = 12
login_max_failures = 5           # then each failed sign-in waits longer (max 15 min)
